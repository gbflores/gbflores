<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Guilherme Flores, Senior Full Stack Engineer, Tech Lead and Software Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#a371f7" stop-opacity="0.22"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)" opacity="0.6"/>
  <rect width="1280" height="320" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#30363d"/>
  <rect x="64" y="70" width="64" height="5" rx="2.5" fill="url(#acc)"/>
  <text x="64" y="150" class="sans" font-size="68" font-weight="700" fill="#f0f6fc" letter-spacing="-1.5">Guilherme Flores</text>
  <text x="64" y="200" class="sans" font-size="28" font-weight="500" fill="#9198a1">Senior Full Stack Engineer · Tech Lead · Software Architect</text>
  <text x="64" y="262" class="mono" font-size="22" fill="#3fb950">$</text>
  <text x="88" y="262" class="mono" font-size="22" fill="#9198a1">building for the web since 2009 — Laravel · Vue · Next.js · AI automation <tspan class="cursor" fill="#3fb950">▋</tspan></text>
  <g transform="translate(1066 70)" font-size="15" class="mono" fill="#9198a1">
    <rect width="150" height="34" rx="17" fill="none" stroke="#30363d"/>
    <circle cx="20" cy="17" r="5" fill="#3fb950"/>
    <text x="34" y="22">open to work</text>
  </g>
</svg>
